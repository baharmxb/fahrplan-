pages:
  image: node:22-slim
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm test
    # مسیر سایت از نشانی Pages همین پروژه گرفته می‌شود
    - export NEXT_PUBLIC_BASE_PATH="$(echo "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##')"
    - npm run build
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
